# Gerado por scripts/build_templates.py. Fontes da aplicação em app/.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Campus: VPC, quatro subnets, SGs, duas EC2 privadas e ALB.'
Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI Amazon Linux 2023 STANDARD x86_64 na região do lab; não usar minimal/ARM.
  InstanceType:
    Type: String
    Description: Tipo x86_64 permitido no Academy.
    Default: t3.micro
    AllowedValues:
    - t3.micro
    - t2.micro
    - t3.small
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Primeira AZ da região.
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Segunda AZ, diferente da primeira.
  AllowedWebCidr:
    Type: String
    Description: IPv4 público da turma/rede em CIDR; 0.0.0.0/0 permite acesso público.
    Default: 0.0.0.0/0
    AllowedPattern: (\d{1,3}\.){3}\d{1,3}/\d{1,2}
  HttpsHost:
    Type: String
    Description: Deixe vazio inicialmente. Depois de validar HTTPS, informe o hostname certificado para redirecionar
      HTTP.
    Default: ''
    AllowedPattern: ^$|^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$
Conditions:
  UseHttps:
    Fn::Not:
    - Fn::Equals:
      - Ref: HttpsHost
      - ''
Rules:
  DistinctZones:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: AvailabilityZoneA
          - Ref: AvailabilityZoneB
      AssertDescription: Selecione duas zonas diferentes.
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-vpc
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties: {}
  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: Igw
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone:
        Ref: AvailabilityZoneA
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-PublicA
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone:
        Ref: AvailabilityZoneB
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-PublicB
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone:
        Ref: AvailabilityZoneA
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-PrivateA
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.0.12.0/24
      AvailabilityZone:
        Ref: AvailabilityZoneB
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-PrivateB
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: Igw
    DependsOn: IgwAttachment
  PublicAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicA
      RouteTableId:
        Ref: PublicRoutes
  PublicBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicB
      RouteTableId:
        Ref: PublicRoutes
  PrivateAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PrivateA
      RouteTableId:
        Ref: PrivateRoutes
  PrivateBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PrivateB
      RouteTableId:
        Ref: PrivateRoutes
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: Vpc
      GroupDescription: Entrada HTTP da turma; saida apenas para aplicacao.
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp:
          Ref: AllowedWebCidr
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 8080
        ToPort: 8080
        DestinationSecurityGroupId:
          Ref: AppSg
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: Vpc
      GroupDescription: App privada sem acesso direto da internet.
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 1
        ToPort: 1
        CidrIp: 127.0.0.1/32
        Description: Regra sem destino remoto util para suprimir allow-all padrao.
  AlbToApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: AppSg
      SourceSecurityGroupId:
        Ref: AlbSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
  ServerA:
    Type: AWS::EC2::Instance
    Properties:
      ImageId:
        Ref: AmiId
      InstanceType:
        Ref: InstanceType
      SubnetId:
        Ref: PrivateA
      SecurityGroupIds:
      - Ref: AppSg
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/campus-bootstrap.log /dev/console) 2>&1
          command -v python3
          mkdir -p /opt/campus
          base64 -d <<'CAMPUS_ARCHIVE' | tar -xz -C /opt/campus
          
          CAMPUS_ARCHIVE
          chmod -R a+rX /opt/campus
          cat > /etc/systemd/system/campus.service <<'SERVICE'
          [Unit]
          Description=Campus Cloud Lab
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=nobody
          Group=nobody
          WorkingDirectory=/opt/campus
          Environment=HOST=0.0.0.0
          Environment=PORT=8080
          Environment="NODE_NAME=Servidor A"
          ExecStart=/usr/bin/python3 /opt/campus/server.py
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          [Install]
          WantedBy=multi-user.target
          SERVICE
          systemctl daemon-reload
          systemctl enable --now campus
          python3 -c "import urllib.request,time; time.sleep(2); print(urllib.request.urlopen('http://127.0.0.1:8080/health').read())"
          echo CAMPUS_BOOTSTRAP_OK
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: 8
          VolumeType: gp3
          Encrypted: true
          DeleteOnTermination: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-servidor-A
  ServerB:
    Type: AWS::EC2::Instance
    Properties:
      ImageId:
        Ref: AmiId
      InstanceType:
        Ref: InstanceType
      SubnetId:
        Ref: PrivateB
      SecurityGroupIds:
      - Ref: AppSg
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/campus-bootstrap.log /dev/console) 2>&1
          command -v python3
          mkdir -p /opt/campus
          base64 -d <<'CAMPUS_ARCHIVE' | tar -xz -C /opt/campus
          
          CAMPUS_ARCHIVE
          chmod -R a+rX /opt/campus
          cat > /etc/systemd/system/campus.service <<'SERVICE'
          [Unit]
          Description=Campus Cloud Lab
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=nobody
          Group=nobody
          WorkingDirectory=/opt/campus
          Environment=HOST=0.0.0.0
          Environment=PORT=8080
          Environment="NODE_NAME=Servidor B"
          ExecStart=/usr/bin/python3 /opt/campus/server.py
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          [Install]
          WantedBy=multi-user.target
          SERVICE
          systemctl daemon-reload
          systemctl enable --now campus
          python3 -c "import urllib.request,time; time.sleep(2); print(urllib.request.urlopen('http://127.0.0.1:8080/health').read())"
          echo CAMPUS_BOOTSTRAP_OK
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: 8
          VolumeType: gp3
          Encrypted: true
          DeleteOnTermination: true
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-servidor-B
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
      - Ref: PublicA
      - Ref: PublicB
      SecurityGroups:
      - Ref: AlbSg
    DependsOn:
    - InternetRoute
    - PublicAAssociation
    - PublicBAssociation
  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Ref: Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '10'
      - Key: stickiness.enabled
        Value: 'false'
      Targets:
      - Id:
          Ref: ServerA
      - Id:
          Ref: ServerB
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        Fn::If:
        - UseHttps
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              Host:
                Ref: HttpsHost
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn:
              Ref: Targets
Outputs:
  VpcId:
    Value:
      Ref: Vpc
  AlbArn:
    Value:
      Ref: Alb
  AlbDnsName:
    Value:
      Fn::GetAtt:
      - Alb
      - DNSName
  AlbHostedZoneId:
    Value:
      Fn::GetAtt:
      - Alb
      - CanonicalHostedZoneID
  AlbSecurityGroupId:
    Value:
      Ref: AlbSg
  TargetGroupArn:
    Value:
      Ref: Targets
  HttpUrl:
    Value:
      Fn::Sub: http://${Alb.DNSName}
  ServerAId:
    Value:
      Ref: ServerA
  ServerBId:
    Value:
      Ref: ServerB
  PrivateIpA:
    Value:
      Fn::GetAtt:
      - ServerA
      - PrivateIp
  PrivateIpB:
    Value:
      Fn::GetAtt:
      - ServerB
      - PrivateIp
